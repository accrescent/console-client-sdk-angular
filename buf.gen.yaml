version: v2
plugins:
  - local: protoc-gen-es
    out: .
    opt:
      - target=ts
      - valid_types=protovalidate_required
    include_imports: true
  - local: protoc-gen-grpc-angular
    opt:
      - target=ts
      - valid_types=true
    out: .
inputs:
  # Update with `buf registry module commit list buf.build/accrescent/console-api:<tag>`
  - module: buf.build/accrescent/console-api:dab75e65b1994ceb98677f9c082e2d45 # v0.8.0
